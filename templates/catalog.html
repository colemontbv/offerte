<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Offerte opmaken — {{ company_name }}</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --moss: #2d4a2d; --moss-light: #edf2ed; --primary: #3b6e3b;
      --text: #1a1a1a; --text-muted: #6b7280;
      --border: #e5e7eb; --surface: #fff; --bg: #f5f0e8;
      --radius: 10px;
    }
    body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); }

    /* ── Header ── */
    header {
      background: var(--moss); color: #fff;
      padding: 0 24px; height: 56px;
      display: flex; align-items: center; justify-content: space-between;
      position: sticky; top: 0; z-index: 100;
    }
    .h-brand { font-weight: 700; font-size: 16px; }
    .h-right  { display: flex; align-items: center; gap: 16px; font-size: 13px; }
    .h-user   { opacity: .8; }
    .btn-sm {
      padding: 5px 14px; border-radius: 6px; font-size: 12px; font-weight: 600;
      cursor: pointer; border: 1.5px solid rgba(255,255,255,.4);
      background: transparent; color: #fff; transition: background .15s;
    }
    .btn-sm:hover { background: rgba(255,255,255,.15); }
    .btn-quote {
      background: #fff; color: var(--moss); border-color: #fff;
      display: flex; align-items: center; gap: 6px;
    }
    .btn-quote:hover { background: #f0f0f0; }
    .cart-badge {
      background: #e74c3c; color: #fff; border-radius: 10px;
      font-size: 10px; font-weight: 700; padding: 1px 6px; min-width: 18px;
      text-align: center; display: none;
    }

    /* ── Layout ── */
    .main { max-width: 1280px; margin: 0 auto; padding: 24px 20px; }

    /* ── Toolbar ── */
    .toolbar {
      display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
      margin-bottom: 8px;
    }
    .search-wrap { position: relative; flex: 1; min-width: 200px; max-width: 360px; }
    .search-wrap input {
      width: 100%; padding: 8px 14px 8px 36px;
      border: 1.5px solid var(--border); border-radius: 8px;
      font-size: 13px; font-family: inherit; outline: none;
      transition: border-color .15s;
    }
    .search-wrap input:focus { border-color: var(--primary); }
    .search-icon { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: var(--text-muted); font-size: 14px; pointer-events: none; }

    /* ── Categorie filter (2 lagen) ── */
    .cat-filters { margin-bottom: 20px; }
    .cat-row {
      display: flex; gap: 6px; flex-wrap: wrap; align-items: center;
      padding: 6px 0;
    }
    .cat-row + .cat-row {
      border-top: 1px solid var(--border); padding-top: 10px; margin-top: 2px;
    }
    .cat-btn {
      padding: 5px 12px; border-radius: 20px; font-size: 11px; font-weight: 600;
      border: 1.5px solid var(--border); background: #fff; color: var(--text-muted);
      cursor: pointer; transition: all .12s; white-space: nowrap;
    }
    .cat-btn:hover { border-color: var(--primary); color: var(--primary); }
    .cat-btn.active { background: var(--moss); border-color: var(--moss); color: #fff; }
    .cat-btn.parent-active { background: var(--moss-light); border-color: var(--primary); color: var(--primary); }

    /* ── Product grid ── */
    .product-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 16px;
    }
    .prod-card {
      background: var(--surface); border-radius: var(--radius);
      border: 1.5px solid var(--border);
      display: flex; flex-direction: column;
      transition: box-shadow .15s, border-color .15s;
      overflow: hidden;
    }
    .prod-card:hover { box-shadow: 0 4px 16px rgba(0,0,0,.1); border-color: #ccc; }
    .prod-img {
      width: 100%; aspect-ratio: 4/3; object-fit: contain;
      background: #f8f6f1; padding: 12px;
    }
    .prod-img-placeholder {
      width: 100%; aspect-ratio: 4/3; background: #f0ede6;
      display: flex; align-items: center; justify-content: center;
      color: var(--text-muted); font-size: 32px;
    }
    .prod-body { padding: 12px; flex: 1; display: flex; flex-direction: column; gap: 6px; }
    .prod-name { font-size: 13px; font-weight: 600; color: var(--text); line-height: 1.35; }
    .prod-ref  { font-size: 10px; color: var(--text-muted); }
    .prod-desc { font-size: 11px; color: var(--text-muted); line-height: 1.4; flex: 1; }
    .prod-footer { padding: 0 12px 12px; display: flex; align-items: center; gap: 8px; }
    .prod-price { font-size: 15px; font-weight: 700; color: var(--moss); flex: 1; }
    .qty-wrap { display: flex; align-items: center; gap: 4px; }
    .qty-btn {
      width: 26px; height: 26px; border-radius: 6px; border: 1.5px solid var(--border);
      background: #fff; font-size: 16px; line-height: 1; cursor: pointer;
      display: flex; align-items: center; justify-content: center; color: var(--text);
      transition: background .1s;
    }
    .qty-btn:hover { background: var(--moss-light); border-color: var(--primary); }
    .qty-val {
      width: 32px; text-align: center; font-size: 13px; font-weight: 600;
      border: none; outline: none; background: transparent;
    }
    .btn-add {
      padding: 6px 14px; background: var(--moss); color: #fff;
      border: none; border-radius: 7px; font-size: 12px; font-weight: 600;
      cursor: pointer; transition: background .12s; white-space: nowrap;
    }
    .btn-add:hover { background: var(--primary); }
    .btn-add.in-cart { background: #1a7f1a; }

    /* ── Empty state ── */
    .empty { text-align: center; padding: 60px 20px; color: var(--text-muted); }
    .empty p { margin-top: 8px; font-size: 14px; }

    /* ── Loading ── */
    .loading { text-align: center; padding: 60px; color: var(--text-muted); font-size: 14px; }

    /* ── Variant modal ── */
    .modal-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,.45);
      display: flex; align-items: center; justify-content: center;
      z-index: 500; padding: 20px;
    }
    .modal-overlay.hidden { display: none; }
    .modal-box {
      background: #fff; border-radius: 12px; padding: 24px;
      max-width: 480px; width: 100%; max-height: 80vh;
      overflow-y: auto; box-shadow: 0 8px 32px rgba(0,0,0,.2);
    }
    .modal-title { font-size: 16px; font-weight: 700; margin-bottom: 4px; }
    .modal-sub   { font-size: 12px; color: var(--text-muted); margin-bottom: 16px; }
    .variant-list { display: flex; flex-direction: column; gap: 8px; }
    .variant-row {
      display: flex; align-items: center; gap: 10px;
      padding: 10px 12px; border: 1.5px solid var(--border); border-radius: 8px;
      transition: border-color .12s;
    }
    .variant-row:hover { border-color: var(--primary); }
    .variant-name  { flex: 1; font-size: 13px; font-weight: 500; }
    .variant-price { font-size: 13px; font-weight: 700; color: var(--moss); white-space: nowrap; }
    .variant-qty-wrap { display: flex; align-items: center; gap: 3px; }
    .v-qty-btn {
      width: 24px; height: 24px; border-radius: 5px; border: 1.5px solid var(--border);
      background: #fff; font-size: 15px; cursor: pointer; display: flex;
      align-items: center; justify-content: center; color: var(--text);
    }
    .v-qty-btn:hover { background: var(--moss-light); }
    .v-qty-val {
      width: 30px; text-align: center; font-size: 13px; font-weight: 600;
      border: none; outline: none; background: transparent;
    }
    .btn-v-add {
      padding: 6px 12px; background: var(--moss); color: #fff;
      border: none; border-radius: 7px; font-size: 12px; font-weight: 600;
      cursor: pointer; white-space: nowrap;
    }
    .btn-v-add:hover { background: var(--primary); }
    .btn-v-add.in-cart { background: #1a7f1a; }
    .modal-close {
      display: block; margin-top: 16px; width: 100%; padding: 8px;
      border: 1.5px solid var(--border); border-radius: 8px; background: #fff;
      font-size: 13px; cursor: pointer; color: var(--text-muted);
    }
    .modal-close:hover { background: #f5f5f5; }
    .modal-loading { text-align: center; padding: 24px; color: var(--text-muted); }
    .btn-add.has-variants { background: var(--primary); }
  </style>
</head>
<body>
  <header>
    <span class="h-brand">{{ company_name }} — Offerte</span>
    <div class="h-right">
      <span class="h-user">{{ partner_name }}</span>
      <button class="btn-sm btn-quote" onclick="goToQuote()">
        🛒 Offerte bekijken <span class="cart-badge" id="cart-badge">0</span>
      </button>
      <button class="btn-sm" onclick="doLogout()">Afmelden</button>
    </div>
  </header>

  <!-- Variant modal -->
  <div class="modal-overlay hidden" id="variant-modal" onclick="closeVariantModal(event)">
    <div class="modal-box">
      <div class="modal-title" id="vm-title"></div>
      <div class="modal-sub">Kies de gewenste variant:</div>
      <div class="variant-list" id="vm-list"></div>
      <button class="modal-close" onclick="closeVariantModalDirect()">Sluiten</button>
    </div>
  </div>

  <div class="main">
    <div class="toolbar">
      <div class="search-wrap">
        <span class="search-icon">🔍</span>
        <input type="search" id="search-input" placeholder="Zoek product…" oninput="filterProducts()">
      </div>
    </div>
    <div class="cat-filters" id="cat-filters"></div>
    <div id="product-grid" class="product-grid">
      <div class="loading">Producten laden…</div>
    </div>
  </div>

  <script>
    let allProducts   = [];
    let cart          = JSON.parse(sessionStorage.getItem('offerte_cart') || '{}');
    let activeCatId   = null;   // null = alle; number = gefilterd op cat
    let activeParent  = null;   // null = geen parent geselecteerd
    let imageCache    = {};
    let allCategories = [];
    let catMap        = {};     // id -> category object

    // ── Laden ─────────────────────────────────────────────────────────
    async function loadProducts() {
      try {
        const r = await fetch('/api/products');
        const d = await r.json();
        if (d.error) throw new Error(d.error);
        allProducts   = d.products   || [];
        allCategories = d.categories || [];
        catMap = {};
        allCategories.forEach(c => { catMap[c.id] = c; });
        buildCatFilter();
        renderGrid();
        updateCartBadge();
      } catch(e) {
        document.getElementById('product-grid').innerHTML =
          '<div class="empty">⚠ Producten konden niet worden geladen.</div>';
      }
    }

    function buildCatFilter() {
      const usedIds = new Set(allProducts.flatMap(p => (p.web_categories||[]).map(c => c.id)));

      // Bepaal parents: categorie waarvan parent_id niet in onze lijst zit (of false)
      const isRoot = c => !c.parent_id || !catMap[c.parent_id[0]];
      const parents = allCategories.filter(c => usedIds.has(c.id) && isRoot(c))
                                    .sort((a,b) => a.name.localeCompare(b.name));
      // Kinderen van een parent
      const childrenOf = pid => allCategories
        .filter(c => usedIds.has(c.id) && c.parent_id && c.parent_id[0] === pid)
        .sort((a,b) => a.name.localeCompare(b.name));

      const wrap = document.getElementById('cat-filters');

      // Rij 1: Alle + parents
      const parentBtns = parents.map(c => {
        const kids = childrenOf(c.id);
        const isActive = activeParent === c.id;
        return `<button class="cat-btn${isActive ? ' parent-active' : ''}" id="pbtn-${c.id}"
                  onclick="selectParent(${c.id})">${escHtml(c.name)}${kids.length ? ' ›' : ''}</button>`;
      }).join('');

      // Rij 2: kinderen van geselecteerde parent (als die kinderen heeft)
      let childRow = '';
      if (activeParent !== null) {
        const kids = childrenOf(activeParent);
        if (kids.length) {
          const allKidsBtn = `<button class="cat-btn${activeCatId === null ? ' active' : ''}"
                                onclick="setActiveCat(null)">Alle ${escHtml(catMap[activeParent]?.name||'')}</button>`;
          const kidBtns = kids.map(c =>
            `<button class="cat-btn${activeCatId === c.id ? ' active' : ''}"
               onclick="setActiveCat(${c.id})">${escHtml(c.name)}</button>`
          ).join('');
          childRow = `<div class="cat-row">${allKidsBtn}${kidBtns}</div>`;
        }
      }

      wrap.innerHTML =
        `<div class="cat-row">
           <button class="cat-btn${activeParent === null && activeCatId === null ? ' active' : ''}"
                   onclick="selectParent(null)">Alle</button>
           ${parentBtns}
         </div>${childRow}`;
    }

    function selectParent(pid) {
      activeParent = pid;
      activeCatId  = null;
      // Als de parent geen kinderen heeft, filter direct op die parent-categorie
      if (pid !== null) {
        const kids = allCategories.filter(c =>
          c.parent_id && c.parent_id[0] === pid &&
          new Set(allProducts.flatMap(p => (p.web_categories||[]).map(x => x.id))).has(c.id)
        );
        if (!kids.length) activeCatId = pid;
      }
      buildCatFilter();
      renderGrid();
    }

    function setActiveCat(cid) {
      activeCatId = cid;
      buildCatFilter();
      renderGrid();
    }

    function filterProducts() { renderGrid(); }

    function renderGrid() {
      const q = document.getElementById('search-input').value.toLowerCase();
      let list = allProducts;
      // Filter op actieve categorie (kind of parent zonder kinderen)
      if (activeCatId !== null) {
        list = list.filter(p => (p.web_categories||[]).some(c => c.id === activeCatId));
      } else if (activeParent !== null) {
        // Filter op alle producten die een kind-categorie van de parent hebben
        const kidIds = new Set(allCategories
          .filter(c => c.parent_id && c.parent_id[0] === activeParent)
          .map(c => c.id));
        kidIds.add(activeParent);
        list = list.filter(p => (p.web_categories||[]).some(c => kidIds.has(c.id)));
      }
      if (q) list = list.filter(p => (p.name||'').toLowerCase().includes(q)
                                  || (p.default_code||'').toLowerCase().includes(q));
      const grid = document.getElementById('product-grid');
      if (!list.length) {
        grid.innerHTML = '<div class="empty">🔍<p>Geen producten gevonden.</p></div>';
        return;
      }
      grid.innerHTML = list.map(p => buildCard(p)).join('');
      setTimeout(observeImages, 0);
    }

    function buildCard(p) {
      const hasVariants = (p.product_variant_count || 0) > 1;
      const cartKey = p.id;  // for templates; variant items use 'v_<variantId>'
      const inCart  = hasVariants
        ? Object.keys(cart).some(k => k.startsWith(`v_`) && cart[k].tmpl_id === p.id)
        : !!cart[cartKey];
      const qty     = cart[cartKey]?.qty || 1;
      const rawPrice = p.display_price || 0;
      const prefix   = p.price_prefix || '';
      const price    = (prefix ? `<span style="font-size:10px;font-weight:500">${escHtml(prefix)} </span>` : '') + formatEuro(rawPrice);
      const uom     = p.uom_id ? p.uom_id[1] : '';
      const ref     = p.default_code ? `<div class="prod-ref">${escHtml(p.default_code)}</div>` : '';
      const desc    = p.description_sale
        ? `<div class="prod-desc">${escHtml(p.description_sale.slice(0,120))}${p.description_sale.length>120?'…':''}</div>`
        : '';
      const addBtn = hasVariants
        ? `<button class="btn-add has-variants${inCart?' in-cart':''}" id="add-${p.id}" onclick="openVariantModal(${p.id})">
             ${inCart ? '✓ Varianten' : '⊞ Kies variant'}
           </button>`
        : `<button class="btn-add${inCart?' in-cart':''}" id="add-${p.id}" onclick="addToCart(${p.id})">
             ${inCart ? '✓ Toegevoegd' : '+ Voeg toe'}
           </button>`;
      const qtyControls = hasVariants ? '' : `
            <div class="qty-wrap">
              <button class="qty-btn" onclick="changeQty(${p.id},-1)">−</button>
              <input class="qty-val" type="number" min="1" value="${qty}" id="qty-${p.id}"
                     onchange="setQty(${p.id}, this.value)" onclick="this.select()">
              <button class="qty-btn" onclick="changeQty(${p.id},1)">+</button>
            </div>`;
      return `
        <div class="prod-card" data-id="${p.id}">
          <div class="prod-img-placeholder" id="img-wrap-${p.id}" onclick="loadImage(${p.id})">📷</div>
          <div class="prod-body">
            <div class="prod-name">${escHtml(p.name)}</div>
            ${ref}${desc}
          </div>
          <div class="prod-footer">
            <div class="prod-price">${price}<small style="font-size:10px;font-weight:400;color:var(--text-muted)"> / ${escHtml(uom)}</small></div>
            ${qtyControls}
            ${addBtn}
          </div>
        </div>`;
    }

    async function loadImageEl(el) {
      const id = parseInt(el.closest('[data-id]')?.dataset.id);
      if (!id || imageCache[id]) return;
      imageCache[id] = true;
      try {
        const r = await fetch(`/api/product/${id}/image`);
        if (r.status === 204) { el.innerHTML = ''; return; }
        const blob = await r.blob();
        const url  = URL.createObjectURL(blob);
        const img = document.createElement('img');
        img.className = 'prod-img';
        img.src = url;
        img.alt = '';
        el.replaceWith(img);
      } catch(_) {}
    }

    // Laad zichtbare beelden direct; rest via IntersectionObserver
    function observeImages() {
      const placeholders = [...document.querySelectorAll('.prod-img-placeholder')];
      if (!placeholders.length) return;

      // Laad alle placeholders in batches van 4, met 50ms pauze
      let i = 0;
      function nextBatch() {
        const batch = placeholders.slice(i, i + 4);
        if (!batch.length) return;
        batch.forEach(el => loadImageEl(el));
        i += 4;
        if (i < placeholders.length) setTimeout(nextBatch, 50);
      }
      nextBatch();
    }

    // ── Variant modal ──────────────────────────────────────────────────
    let currentTmplId = null;
    let variantStore  = {};  // varId -> {id, tmpl_id, name, price, uom, ref}

    async function openVariantModal(tmplId) {
      currentTmplId = tmplId;
      const p = allProducts.find(x => x.id === tmplId);
      document.getElementById('vm-title').textContent = p ? p.name : 'Varianten';
      document.getElementById('vm-list').innerHTML = '<div class="modal-loading">Laden…</div>';
      document.getElementById('variant-modal').classList.remove('hidden');

      try {
        const r = await fetch(`/api/product/${tmplId}/variants`);
        const d = await r.json();
        if (d.error) throw new Error(d.error);
        renderVariantList(tmplId, d.variants || [], p);
      } catch(e) {
        document.getElementById('vm-list').innerHTML =
          `<div class="modal-loading">Fout: ${escHtml(e.message)}</div>`;
      }
    }

    function renderVariantList(tmplId, variants, tmpl) {
      const uom = tmpl?.uom_id?.[1] || '';
      // Sla variant-data op zodat onclick-handlers geen JSON in attributen nodig hebben
      variants.forEach(v => {
        variantStore[v.id] = {
          id: v.id, tmpl_id: tmplId,
          name: v.variant_label || v.display_name,
          price: v.display_price, uom, ref: v.default_code || ''
        };
      });
      const html = variants.map(v => {
        const cartKey = `v_${v.id}`;
        const inCart  = !!cart[cartKey];
        const qty     = cart[cartKey]?.qty || 1;
        return `
          <div class="variant-row">
            <div class="variant-name">${escHtml(v.variant_label || v.display_name)}</div>
            <div class="variant-price">${formatEuro(v.display_price)}</div>
            <div class="variant-qty-wrap">
              <button class="v-qty-btn" onclick="changeVQty(${v.id},-1)">−</button>
              <input class="v-qty-val" type="number" min="1" value="${qty}"
                     id="vqty-${v.id}" onchange="setVQty(${v.id}, this.value)" onclick="this.select()">
              <button class="v-qty-btn" onclick="changeVQty(${v.id},1)">+</button>
            </div>
            <button class="btn-v-add${inCart?' in-cart':''}" id="vadd-${v.id}"
                    onclick="addVariantToCart(${v.id})">
              ${inCart ? '✓ In offerte' : '+ Voeg toe'}
            </button>
          </div>`;
      }).join('');
      document.getElementById('vm-list').innerHTML = html || '<div class="modal-loading">Geen varianten gevonden.</div>';
    }

    function addVariantToCart(varId) {
      const v = variantStore[varId];
      if (!v) return;
      const cartKey = `v_${varId}`;
      const qty = parseInt(document.getElementById(`vqty-${varId}`)?.value) || 1;
      cart[cartKey] = { id: varId, tmpl_id: v.tmpl_id, name: v.name, price: v.price, qty, uom: v.uom, ref: v.ref };
      saveCart();
      updateCartBadge();
      const btn = document.getElementById(`vadd-${varId}`);
      if (btn) { btn.classList.add('in-cart'); btn.textContent = '✓ In offerte'; }
      const cardBtn = document.getElementById(`add-${v.tmpl_id}`);
      if (cardBtn) { cardBtn.classList.add('in-cart'); cardBtn.innerHTML = '✓ Varianten'; }
    }

    function changeVQty(varId, delta) {
      const inp = document.getElementById(`vqty-${varId}`);
      if (!inp) return;
      const newQty = Math.max(1, (parseInt(inp.value)||1) + delta);
      inp.value = newQty;
      const cartKey = `v_${varId}`;
      if (cart[cartKey]) { cart[cartKey].qty = newQty; saveCart(); }
    }

    function setVQty(varId, val) {
      const q = Math.max(1, parseInt(val)||1);
      const inp = document.getElementById(`vqty-${varId}`);
      if (inp) inp.value = q;
      const cartKey = `v_${varId}`;
      if (cart[cartKey]) { cart[cartKey].qty = q; saveCart(); }
    }

    function closeVariantModal(e) {
      if (e.target === document.getElementById('variant-modal')) closeVariantModalDirect();
    }
    function closeVariantModalDirect() {
      document.getElementById('variant-modal').classList.add('hidden');
      currentTmplId = null;
    }

    // ── Cart ──────────────────────────────────────────────────────────
    function addToCart(id) {
      const p   = allProducts.find(x => x.id === id);
      if (!p) return;
      const qty = parseInt(document.getElementById(`qty-${id}`)?.value) || 1;
      const cartPrice = p.display_price || 0;
      cart[id]  = { id, name: p.name, price: cartPrice, qty, uom: p.uom_id?.[1]||'', ref: p.default_code||'' };
      saveCart();
      updateCartBadge();
      const btn = document.getElementById(`add-${id}`);
      if (btn) { btn.classList.add('in-cart'); btn.textContent = '✓ Toegevoegd'; }
    }

    function changeQty(id, delta) {
      const inp = document.getElementById(`qty-${id}`);
      if (!inp) return;
      const newQty = Math.max(1, (parseInt(inp.value)||1) + delta);
      inp.value = newQty;
      if (cart[id]) { cart[id].qty = newQty; saveCart(); }
    }

    function setQty(id, val) {
      const q = Math.max(1, parseInt(val)||1);
      document.getElementById(`qty-${id}`).value = q;
      if (cart[id]) { cart[id].qty = q; saveCart(); }
    }

    function saveCart() { sessionStorage.setItem('offerte_cart', JSON.stringify(cart)); }

    function updateCartBadge() {
      const total = Object.keys(cart).length;
      const badge = document.getElementById('cart-badge');
      badge.textContent = total;
      badge.style.display = total > 0 ? 'inline-block' : 'none';
    }

    function goToQuote() {
      if (!Object.keys(cart).length) { alert('Voeg eerst producten toe aan je offerte.'); return; }
      window.location.href = '/quote';
    }

    // ── Afmelden ──────────────────────────────────────────────────────
    async function doLogout() {
      await fetch('/logout', {method:'POST'});
      sessionStorage.removeItem('offerte_cart');
      window.location.href = '/';
    }

    // ── Utils ─────────────────────────────────────────────────────────
    function formatEuro(n) {
      return '€ ' + (n||0).toLocaleString('nl-BE', {minimumFractionDigits:2, maximumFractionDigits:2});
    }
    function escHtml(s) {
      return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    loadProducts();
  </script>
</body>
</html>
